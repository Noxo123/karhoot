<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — Karhoot</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-white grid place-items-center p-6"><main class="w-full max-w-md"><a href="/" class="text-2xl font-black">🎮 Kar<span class="text-indigo-400">hoot</span></a><div class="mt-8 p-8 rounded-3xl bg-white/5 border border-white/10"><h1 class="text-3xl font-black">Bon retour 👋</h1><p class="text-slate-400 mt-2">Connecte-toi pour reprendre ta progression.</p><form id="form" class="space-y-4 mt-7"><input id="email" type="email" required placeholder="Email" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10 outline-none focus:border-indigo-400"><input id="password" type="password" required placeholder="Mot de passe" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10 outline-none focus:border-indigo-400"><button class="w-full p-4 rounded-xl bg-indigo-500 hover:bg-indigo-400 font-bold">Se connecter</button><p id="error" class="text-red-400 text-sm"></p></form><p class="text-slate-400 mt-6 text-center">Pas encore de compte ? <a class="text-indigo-400" href="/register.html">Créer un compte</a></p></div></main><script>form.onsubmit=async e=>{e.preventDefault();error.textContent='';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)return error.textContent=d.error;localStorage.setItem('karhoot_token',d.token);localStorage.setItem('karhoot_user',JSON.stringify(d.user));location.href=d.user.role==='teacher'?'/teacher.html':'/student.html'};</script></body></html>
