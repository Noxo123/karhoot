<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte — Karhoot</title><link rel="stylesheet" href="/tailwind.css"><link rel="stylesheet" href="/app.css"></head><body class="min-h-screen bg-slate-950 text-white grid place-items-center p-6 min-h-screen bg-slate-950 text-white grid place-items-center p-6 kh-shell"><div class="kh-orb one"></div><div class="kh-orb two"></div><main class="w-full max-w-md"><a href="/" class="text-2xl font-black"><span class="kh-brand-mark"><img src="/brand-mark.svg" alt="" aria-hidden="true"></span><span>Kar<span class="text-indigo-400">hoot</span></span></a><div class="mt-8 p-8 rounded-3xl bg-white/5 border border-white/10"><h1 class="text-3xl font-black">Bienvenue 🎉</h1><p class="text-slate-400 mt-2">Crée ton profil Karhoot.</p><form id="form" class="space-y-4 mt-7"><input id="username" required minlength="3" maxlength="24" placeholder="Pseudo" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10"><input id="email" type="email" required maxlength="254" placeholder="Email" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10"><input id="password" type="password" required minlength="8" maxlength="100" placeholder="Mot de passe (8 caractères min.)" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10"><select id="role" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10"><option value="student">🎓 Élève</option><option value="teacher">👨‍🏫 Professeur</option></select><input id="teacherCode" type="password" maxlength="128" placeholder="Code professeur (si demandé)" class="hidden w-full p-4 rounded-xl bg-slate-900 border border-white/10"><button class="w-full p-4 rounded-xl bg-indigo-500 hover:bg-indigo-400 font-bold">Créer mon compte</button><p id="error" class="text-red-400 text-sm" role="alert"></p></form><p class="text-slate-400 mt-6 text-center">Déjà inscrit ? <a class="text-indigo-400" href="/login.html">Se connecter</a></p></div></main><script>const formEl=document.getElementById('form'),roleEl=document.getElementById('role'),codeEl=document.getElementById('teacherCode'),errorEl=document.getElementById('error');roleEl.onchange=()=>codeEl.classList.toggle('hidden',roleEl.value!=='teacher');formEl.onsubmit=async e=>{e.preventDefault();errorEl.textContent='';try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,email:document.getElementById('email').value,password:document.getElementById('password').value,role:roleEl.value,teacherCode:codeEl.value||undefined})});const d=await r.json().catch(()=>({}));if(!r.ok)return errorEl.textContent=d.error||'Inscription impossible';localStorage.setItem('karhoot_token',d.token);localStorage.setItem('karhoot_user',JSON.stringify(d.user));location.href=d.user.role==='teacher'?'/teacher.html':'/student.html'}catch{errorEl.textContent='Serveur indisponible.'}};</script><script src="/app.js" defer></script></body></html>
