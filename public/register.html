<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte — Karhoot</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-white grid place-items-center p-6"><main class="w-full max-w-md"><a href="/" class="text-2xl font-black">🎮 Kar<span class="text-indigo-400">hoot</span></a><div class="mt-8 p-8 rounded-3xl bg-white/5 border border-white/10"><h1 class="text-3xl font-black">Bienvenue 🎉</h1><p class="text-slate-400 mt-2">Choisis ton profil et commence l'aventure.</p><form id="form" class="space-y-4 mt-7"><input id="username" required minlength="3" placeholder="Pseudo" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10"><input id="email" type="email" required placeholder="Email" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10"><input id="password" type="password" required minlength="6" placeholder="Mot de passe (6 caractères min.)" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10"><select id="role" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10"><option value="student">🎓 Élève</option><option value="teacher">👨‍🏫 Professeur</option></select><button class="w-full p-4 rounded-xl bg-indigo-500 hover:bg-indigo-400 font-bold">Créer mon compte</button><p id="error" class="text-red-400 text-sm"></p></form><p class="text-slate-400 mt-6 text-center">Déjà inscrit ? <a class="text-indigo-400" href="/login.html">Se connecter</a></p></div></main><script>form.onsubmit=async e=>{e.preventDefault();error.textContent='';const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,email:email.value,password:password.value,role:role.value})});const d=await r.json();if(!r.ok)return error.textContent=d.error;localStorage.setItem('karhoot_token',d.token);localStorage.setItem('karhoot_user',JSON.stringify(d.user));location.href=d.user.role==='teacher'?'/teacher.html':'/student.html'};</script></body></html>
