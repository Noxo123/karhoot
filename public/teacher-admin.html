<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration prof — Karhoot</title><link rel="stylesheet" href="/tailwind.css"><style>body{background:#09090b;color:#f4f4f5}.glass{background:rgba(24,24,27,.82);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px)}.student{cursor:grab;transition:transform .18s,box-shadow .18s,opacity .18s}.student:active{cursor:grabbing}.student.dragging{opacity:.35;transform:scale(.97)}.dropzone{transition:.2s;border:1px dashed rgba(255,255,255,.1)}.dropzone.over{border-color:#a855f7;background:rgba(168,85,247,.1);transform:scale(1.01)}</style></head><body class="min-h-screen"><main class="max-w-7xl mx-auto p-5 md:p-8"><header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8"><div><div class="text-purple-400 font-bold tracking-wide">KARHOOT / PROF</div><h1 class="text-3xl md:text-4xl font-black mt-1">Administration</h1><p class="text-zinc-400 mt-2">Gère tes classes, déplace tes élèves et prépare les futurs éléments de la boutique.</p></div><a href="/" class="glass rounded-xl px-4 py-3 hover:bg-white/5">← Retour</a></header><nav class="glass rounded-2xl p-2 flex gap-2 mb-6"><button class="tab px-4 py-3 rounded-xl bg-purple-600 font-semibold" data-tab="students">👥 Élèves & classes</button><button class="tab px-4 py-3 rounded-xl hover:bg-white/5 font-semibold" data-tab="catalog">🎨 Boutique & SVG</button></nav><section id="studentsTab"><div class="glass rounded-2xl p-5 mb-6"><div class="flex flex-col md:flex-row gap-3"><input id="className" class="flex-1 bg-zinc-950 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-purple-500" placeholder="Nom de la nouvelle classe"><button id="createClass" class="bg-purple-600 hover:bg-purple-500 rounded-xl px-5 py-3 font-bold">+ Créer une classe</button></div></div><div id="classes" class="grid md:grid-cols-2 xl:grid-cols-3 gap-5"></div></section><section id="catalogTab" class="hidden"><div class="grid xl:grid-cols-[1fr_1.3fr] gap-6"><form id="catalogForm" class="glass rounded-2xl p-6 space-y-4"><div><h2 class="text-xl font-bold">Créer un élément Karhoot</h2><p class="text-sm text-zinc-400 mt-1">Crée tes propres personnages, vêtements et accessoires SVG.</p></div><input name="slug" required pattern="[a-z0-9-]+" class="w-full bg-zinc-950 border border-white/10 rounded-xl px-4 py-3" placeholder="slug-exemple"><input name="name" required class="w-full bg-zinc-950 border border-white/10 rounded-xl px-4 py-3" placeholder="Nom de l'élément"><select name="category" class="w-full bg-zinc-950 border border-white/10 rounded-xl px-4 py-3"><option value="character">Personnage</option><option value="style">Cosmétique</option><option value="outfit">Tenue</option><option value="background">Fond</option></select><input name="price" type="number" min="0" value="100" class="w-full bg-zinc-950 border border-white/10 rounded-xl px-4 py-3" placeholder="Prix"><input name="icon" maxlength="8" value="✨" class="w-full bg-zinc-950 border border-white/10 rounded-xl px-4 py-3" placeholder="Emoji"><input name="style" value="karhoot-custom" class="w-full bg-zinc-950 border border-white/10 rounded-xl px-4 py-3" placeholder="Identifiant de style"><textarea name="description" maxlength="240" class="w-full bg-zinc-950 border border-white/10 rounded-xl px-4 py-3" rows="2" placeholder="Description"></textarea><textarea name="svgContent" class="w-full bg-zinc-950 border border-white/10 rounded-xl px-4 py-3 font-mono text-xs" rows="12" placeholder="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 256 256\">...</svg>"></textarea><button class="w-full bg-purple-600 hover:bg-purple-500 rounded-xl py-3 font-bold">Créer dans la boutique</button><div id="catalogMsg" class="text-sm"></div></form><div><h2 class="text-xl font-bold mb-4">Catalogue actuel</h2><div id="catalog" class="grid sm:grid-cols-2 gap-4"></div></div></div></section></main><script>
const token=localStorage.getItem('karhoot_token');if(!token)location.href='/';const headers={'Content-Type':'application/json',Authorization:`Bearer ${token}`};async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers,...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}
let data;async function load(){data=await api('/api/teacher-admin/overview');await loadMemberships();renderClasses();await loadCatalog()}
async function loadMemberships(){const lists=await Promise.all(data.classes.map(c=>api(`/api/teacher-admin/classes/${c.id}/students`)));const map=new Map;lists.forEach((x,i)=>x.students.forEach(s=>{if(!map.has(s.id))map.set(s.id,[]);map.get(s.id).push(data.classes[i].id)}));data.students.forEach(s=>s.class_ids=map.get(s.id)||[])}
function renderClasses(){const root=document.querySelector('#classes');root.innerHTML=data.classes.map(c=>`<article class="glass rounded-2xl p-5"><div class="flex justify-between gap-3 mb-4"><div><h2 class="font-bold text-lg">${esc(c.name)}</h2><div class="text-xs text-zinc-500">Code ${esc(c.code)} · ${c.member_count} élève(s)</div></div><span class="text-purple-300">↔</span></div><div class="dropzone rounded-xl p-3 min-h-28 space-y-2" data-class="${c.id}"><div class="text-xs text-zinc-500">Glisse un élève ici</div>${data.students.filter(s=>s.class_ids.includes(c.id)).map(studentCard).join('')}</div></article>`).join('');root.querySelectorAll('.dropzone').forEach(z=>{z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});z.addEventListener('dragleave',()=>z.classList.remove('over'));z.addEventListener('drop',async e=>{e.preventDefault();z.classList.remove('over');const userId=Number(e.dataTransfer.getData('text/plain'));const from=Number(e.dataTransfer.getData('classId'))||null;try{await api('/api/teacher-admin/students/move',{method:'POST',body:JSON.stringify({userId,fromClassId:from,toClassId:Number(z.dataset.class)})});await load()}catch(err){alert(err.message)}})});root.querySelectorAll('.student').forEach(el=>{el.addEventListener('dragstart',e=>{el.classList.add('dragging');e.dataTransfer.setData('text/plain',el.dataset.user);e.dataTransfer.setData('classId',el.closest('.dropzone').dataset.class)});el.addEventListener('dragend',()=>el.classList.remove('dragging'))})}
function studentCard(s){return `<div draggable="true" data-user="${s.id}" class="student rounded-xl bg-zinc-950/80 border border-white/5 p-3 flex items-center gap-3"><div class="w-9 h-9 rounded-full bg-purple-600/20 grid place-items-center">🎨</div><div class="min-w-0"><div class="font-semibold truncate">${esc(s.username)}</div><div class="text-xs text-zinc-500">Niv. ${s.level}</div></div></div>`}
async function loadCatalog(){const d=await api('/api/teacher-admin/catalog');document.querySelector('#catalog').innerHTML=d.items.map(i=>`<div class="glass rounded-2xl p-4"><div class="flex items-center gap-3"><div class="w-14 h-14 rounded-xl bg-purple-500/10 grid place-items-center text-2xl">${esc(i.icon)}</div><div><div class="font-bold">${esc(i.name)}</div><div class="text-xs text-zinc-500">${esc(i.category)} · ${i.price} 🪙</div></div></div><div class="text-xs text-zinc-400 mt-3">${esc(i.description||'')}</div>${i.has_svg?'<div class="mt-2 text-xs text-emerald-400">✓ SVG personnalisé</div>':''}</div>`).join('')}
document.querySelector('#createClass').onclick=async()=>{const name=document.querySelector('#className').value.trim();if(!name)return;try{await api('/api/teacher-admin/classes',{method:'POST',body:JSON.stringify({name})});document.querySelector('#className').value='';await load()}catch(e){alert(e.message)}};document.querySelector('#catalogForm').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.currentTarget).entries());try{await api('/api/teacher-admin/catalog/items',{method:'POST',body:JSON.stringify(body)});e.currentTarget.reset();document.querySelector('#catalogMsg').textContent='Élément créé ✓';await loadCatalog()}catch(err){document.querySelector('#catalogMsg').textContent=err.message}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('bg-purple-600'));b.classList.add('bg-purple-600');document.querySelector('#studentsTab').classList.toggle('hidden',b.dataset.tab!=='students');document.querySelector('#catalogTab').classList.toggle('hidden',b.dataset.tab!=='catalog')});function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}(async()=>{try{await load()}catch(e){alert(e.message)}})();
</script></body></html>
