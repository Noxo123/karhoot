<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boutique Avatar — Karhoot</title><link rel="stylesheet" href="/tailwind.css"><style>body{background:#08070d}.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1)}.card{transition:.2s}.card:hover{transform:translateY(-3px);border-color:rgba(139,92,246,.7)}</style></head>
<body class="min-h-screen text-white"><header class="sticky top-0 z-30 border-b border-white/10 bg-[#08070d]/90 backdrop-blur-xl"><div class="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center"><a href="/student.html" class="font-black text-xl">K<span class="text-violet-400">.</span> Karhoot</a><div class="flex gap-4 items-center"><span id="coins" class="font-black">🪙 100</span><a href="/student.html" class="text-white/60">Retour</a></div></div></header>
<main class="max-w-7xl mx-auto px-5 py-8"><p class="text-violet-300 text-xs font-black uppercase tracking-[.25em]">Avatar Shop</p><div class="flex flex-wrap justify-between gap-4 items-end"><div><h1 class="text-4xl md:text-5xl font-black mt-2">Ta collection.</h1><p class="text-white/50 mt-2">Personnages, cheveux, yeux, vêtements, couleurs et accessoires. Chaque élément doit être acheté avant d’être équipé.</p></div><div id="message" class="text-sm text-white/60"></div></div>
<section class="grid lg:grid-cols-[360px_1fr] gap-6 mt-8"><aside class="glass rounded-[2rem] p-6 lg:sticky lg:top-24 h-fit"><p class="text-xs uppercase tracking-widest text-white/40 font-black">Aperçu</p><div class="aspect-square rounded-3xl bg-white mt-4 overflow-hidden"><img id="preview" class="w-full h-full object-cover" alt="Avatar"></div><div class="mt-5"><p class="font-black text-xl" id="selectedName">Lumière</p><p class="text-white/45 text-sm mt-1">Les achats sont conservés définitivement dans ton inventaire.</p></div></aside><section><div id="tabs" class="flex flex-wrap gap-2 mb-6"></div><div id="shop" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4"></div></section></section></main>
<script>
const token=localStorage.getItem('karhoot_token');if(!token)location.href='/login.html';const headers={'Content-Type':'application/json',Authorization:`Bearer ${token}`};const state={items:[],coins:100,config:{character:'lorelei-default',outfit:'',background:'',seed:'karhoot',options:{}},tab:'all'};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['all','Tout'],['character','Personnages'],['style','Cosmétiques'],['outfit','Tenues'],['background','Fonds']];
function meta(slug){return state.items.find(x=>x.slug===slug)||{};}function activeCharacter(){return meta(state.config.character)||meta('lorelei-default');}
function previewUrl(item,optionKey='',optionValue=''){const x=item||activeCharacter();const style=x.style||'lorelei';const u=new URL(`https://api.dicebear.com/10.x/${encodeURIComponent(style)}/svg`);u.searchParams.set('seed',state.config.seed||'karhoot');u.searchParams.set('backgroundColor',state.config.background==='midnight'?'111827':state.config.background==='neon'?'c084fc':'ffffff');u.searchParams.set('borderRadius','28');for(const[k,v]of Object.entries(state.config.options||{}))if(v!==''&&v!==null&&v!==undefined)u.searchParams.set(k,String(v));if(optionKey)u.searchParams.set(optionKey,String(optionValue));return u.toString();}
function renderPreview(){const x=activeCharacter();$('preview').src=previewUrl(x);$('selectedName').textContent=x.name||'Avatar';}
function renderTabs(){$('tabs').innerHTML=tabs.map(([id,label])=>`<button data-tab="${id}" class="px-4 py-2 rounded-xl font-bold ${state.tab===id?'bg-violet-600':'bg-white/5 hover:bg-white/10'}">${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderTabs();renderShop()});}
function renderShop(){let list=state.items.filter(x=>state.tab==='all'||x.category===state.tab);$('shop').innerHTML=list.map(x=>{const owned=x.owned,selected=x.equipped;let img=x.optionKey?previewUrl({style:x.style},x.optionKey,x.optionValue):previewUrl(x);if(x.category==='outfit')img=previewUrl({style:'avataaars'},'clothingColor',x.slug==='violet-fit'?'8b5cf6':x.slug==='black-fit'?'111827':'f8fafc');return `<article class="card glass rounded-3xl p-4 ${selected?'ring-2 ring-violet-500':''}"><div class="aspect-square rounded-2xl bg-white overflow-hidden"><img src="${img}" class="w-full h-full object-cover" loading="lazy" alt=""></div><div class="mt-4"><div class="flex justify-between gap-2"><h3 class="font-black">${esc(x.icon)} ${esc(x.name)}</h3><span class="text-xs font-black ${owned?'text-emerald-300':'text-violet-300'}">${owned?'Possédé':'🪙 '+x.price}</span></div><p class="text-xs text-white/45 mt-1 min-h-8">${esc(x.description)}</p><button data-buy="${esc(x.slug)}" class="w-full mt-3 py-2.5 rounded-xl ${owned?'bg-white/10 hover:bg-white/15':'bg-violet-600 hover:bg-violet-500'} font-bold">${owned?(selected?'Équipé ✓':'Équiper'):'Acheter'}</button></div></article>`}).join('');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>handleItem(b.dataset.buy));}
async function handleItem(slug){const x=meta(slug);if(!x)return;if(!x.owned){const r=await fetch('/api/avatars/purchase',{method:'POST',headers,body:JSON.stringify({slug})});const d=await r.json();if(!r.ok){show(d.error||'Achat impossible');return}state.coins=d.coins;x.owned=true;show('Achat effectué ✨')}await equip(x);}
async function equip(x){const next={...state.config,options:{...state.config.options}};if(x.category==='character'){next.character=x.slug;if(x.style!=='toon-head')next.options={}}else if(x.category==='background')next.background=x.slug;else if(x.category==='outfit'){next.character='avataaars';next.outfit=x.slug;next.options={...next.options,clothingColor:x.slug==='violet-fit'?'8b5cf6':x.slug==='black-fit'?'111827':'f8fafc'}}else if(x.optionKey){if(next.character!=='toon-head'){show('Ce cosmétique nécessite le personnage Toon Head.');return}next.options[x.optionKey]=x.optionValue}const r=await fetch('/api/avatars/equip',{method:'POST',headers,body:JSON.stringify(next)});const d=await r.json();if(!r.ok){show(d.error||'Équipement impossible');return}state.config=d.config;renderPreview();renderShop();}
function show(t){$('message').textContent=t;setTimeout(()=>{$('message').textContent=''},2500)}
async function load(){const [a,b]=await Promise.all([fetch('/api/avatars/catalog',{headers}),fetch('/api/avatars/me',{headers})]);if(!a.ok||!b.ok){localStorage.removeItem('karhoot_token');location.href='/login.html';return}const catalog=await a.json(),me=await b.json();state.items=catalog.items;state.coins=me.user.coins;state.config={...state.config,...me.config,options:{...(me.config.options||{})}};$('coins').textContent='🪙 '+state.coins;renderTabs();renderPreview();renderShop();}load();
</script></body></html>
