<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boutique Avatar — Karhoot</title><link rel="stylesheet" href="/tailwind.css"><style>
body{background:#07070b}.glass{background:rgba(18,18,24,.82);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.08)}.card{transition:transform .2s,border-color .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);border-color:rgba(139,92,246,.55);box-shadow:0 18px 50px rgba(0,0,0,.22)}.avatar-stage{background:radial-gradient(circle at 50% 35%,rgba(139,92,246,.18),transparent 52%),linear-gradient(145deg,#fff,#f4f1ff)}.item-img{background:linear-gradient(145deg,#fff,#f6f3ff)}button:disabled{opacity:.55;cursor:not-allowed}
</style></head>
<body class="min-h-screen text-white">
<header class="sticky top-0 z-40 border-b border-white/10 bg-[#07070b]/90 backdrop-blur-xl"><div class="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center gap-4"><a href="/student.html" class="font-black text-xl tracking-tight">K<span class="text-violet-400">.</span> Karhoot</a><div class="flex items-center gap-4"><div class="glass rounded-full px-4 py-2 font-black text-sm">🪙 <span id="coins">100</span></div><a href="/student.html" class="text-white/60 hover:text-white">Retour</a></div></div></header>
<main class="max-w-7xl mx-auto px-5 py-8 md:py-10"><div class="mb-8"><p class="text-violet-300 text-xs font-black uppercase tracking-[.25em]">Avatar Shop</p><h1 class="text-4xl md:text-5xl font-black mt-2">Construis ton avatar.</h1><p class="text-white/45 mt-2 max-w-2xl">Achète chaque élément séparément. Les anciens avatars sont automatiquement convertis vers Toon Head.</p></div>
<div id="message" class="hidden mb-5 rounded-2xl border px-4 py-3 text-sm"></div>
<section class="grid lg:grid-cols-[380px_1fr] gap-6 items-start"><aside class="glass rounded-[2rem] p-6 lg:sticky lg:top-24"><div class="flex justify-between items-center"><div><p class="text-xs uppercase tracking-widest text-white/35 font-black">Aperçu</p><h2 id="selectedName" class="font-black text-xl mt-1">Toon Head</h2></div><span id="previewBadge" class="text-xs px-3 py-1 rounded-full bg-violet-500/15 text-violet-200">Avatar</span></div><div class="avatar-stage aspect-square rounded-[1.7rem] mt-5 overflow-hidden grid place-items-center"><img id="preview" class="w-full h-full object-contain p-5" alt="Prévisualisation de l’avatar"></div><div class="grid grid-cols-2 gap-3 mt-4"><div class="rounded-2xl bg-white/5 p-3"><div class="text-[10px] uppercase text-white/35 font-black">Possédés</div><div id="ownedCount" class="font-black text-lg mt-1">0</div></div><div class="rounded-2xl bg-white/5 p-3"><div class="text-[10px] uppercase text-white/35 font-black">Catalogue</div><div id="catalogCount" class="font-black text-lg mt-1">0</div></div></div></aside>
<section><div id="tabs" class="flex flex-wrap gap-2 mb-6"></div><div id="shop" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4"></div></section></section></main>
<script>
const token=localStorage.getItem('karhoot_token');if(!token)location.href='/login.html';
const headers={'Content-Type':'application/json',Authorization:`Bearer ${token}`};
const state={items:[],coins:100,config:{character:'toon-head',outfit:'',background:'',seed:'karhoot',options:{}},tab:'all',busy:false};
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['all','Tout'],['character','Personnages'],['style','Cosmétiques'],['outfit','Tenues'],['background','Fonds']];
function meta(slug){return state.items.find(x=>x.slug===slug)||null}
function activeCharacter(){return meta(state.config.character)||meta('toon-head')||state.items.find(x=>x.category==='character')||null}
function dicebearUrl(item,extraKey='',extraValue=''){const x=item||activeCharacter();const style=x?.style||'toon-head';const u=new URL(`https://api.dicebear.com/10.x/${encodeURIComponent(style)}/svg`);u.searchParams.set('seed',state.config.seed||'karhoot');u.searchParams.set('backgroundColor','ffffff');u.searchParams.set('borderRadius','28');for(const[k,v]of Object.entries(state.config.options||{}))if(v!==''&&v!==null&&v!==undefined)u.searchParams.set(k,String(v));if(extraKey)u.searchParams.set(extraKey,String(extraValue));return u.toString()}
function itemPreviewUrl(item){if(item?.hasSvg)return `/api/avatars/custom/${encodeURIComponent(item.slug)}.svg`;return dicebearUrl(item,item?.optionKey||'',item?.optionValue||'')}
function renderPreview(item=activeCharacter()){if(!item)return;$('preview').src=itemPreviewUrl(item);$('selectedName').textContent=item.name||'Avatar';$('previewBadge').textContent=item.hasSvg?'SVG Karhoot':item.category==='character'?'Personnage':'Aperçu'}
function renderTabs(){$('tabs').innerHTML=tabs.map(([id,label])=>`<button data-tab="${id}" class="px-4 py-2.5 rounded-xl font-bold text-sm ${state.tab===id?'bg-violet-600 shadow-lg shadow-violet-900/20':'bg-white/5 hover:bg-white/10 text-white/70'}">${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderTabs();renderShop()})}
function renderShop(){const list=state.items.filter(x=>state.tab==='all'||x.category===state.tab);$('catalogCount').textContent=state.items.length;$('ownedCount').textContent=state.items.filter(x=>x.owned).length;$('shop').innerHTML=list.map(x=>{const owned=x.owned,selected=x.equipped;const img=itemPreviewUrl(x);return `<article class="card glass rounded-3xl p-4 ${selected?'ring-2 ring-violet-500/80':''}"><button data-preview="${esc(x.slug)}" class="item-img w-full aspect-square rounded-2xl overflow-hidden block"><img src="${img}" class="w-full h-full object-contain p-3" loading="lazy" alt="${esc(x.name)}"></button><div class="mt-4"><div class="flex justify-between gap-3"><h3 class="font-black leading-tight">${esc(x.icon)} ${esc(x.name)}</h3><span class="shrink-0 text-xs font-black ${owned?'text-emerald-300':'text-violet-300'}">${owned?'Possédé':'🪙 '+x.price}</span></div><p class="text-xs text-white/40 mt-2 min-h-8">${esc(x.description)}</p><button data-buy="${esc(x.slug)}" ${state.busy?'disabled':''} class="w-full mt-3 py-2.5 rounded-xl ${owned?(selected?'bg-emerald-500/15 text-emerald-200':'bg-white/10 hover:bg-white/15'):'bg-violet-600 hover:bg-violet-500'} font-bold">${owned?(selected?'Équipé ✓':'Équiper'):'Acheter · '+x.price+' 🪙'}</button></div></article>`}).join('');document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>renderPreview(meta(b.dataset.preview)));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>handleItem(b.dataset.buy))}
async function handleItem(slug){if(state.busy)return;const x=meta(slug);if(!x)return;state.busy=true;renderShop();try{if(!x.owned){const r=await fetch('/api/avatars/purchase',{method:'POST',headers,body:JSON.stringify({slug})});const d=await r.json().catch(()=>({}));if(!r.ok){show(d.error||'Achat impossible','error');return}state.coins=d.coins;x.owned=true;$('coins').textContent=state.coins;show('Achat effectué · élément ajouté à ta collection','success')}await equip(x)}finally{state.busy=false;renderShop()}}
async function equip(x){const next={...state.config,options:{...state.config.options}};if(x.category==='character'){next.character=x.slug}else if(x.category==='background'){next.background=x.slug}else if(x.optionKey){if(next.character!=='toon-head'){next.character='toon-head'}next.options[x.optionKey]=x.optionValue}else if(x.category==='outfit'){next.outfit=x.slug}const r=await fetch('/api/avatars/equip',{method:'POST',headers,body:JSON.stringify(next)});const d=await r.json().catch(()=>({}));if(!r.ok){show(d.error||'Équipement impossible','error');return}state.config=d.config||next;renderPreview(meta(state.config.character));renderShop()}
function show(text,type='info'){$('message').textContent=text;$('message').className=`mb-5 rounded-2xl border px-4 py-3 text-sm ${type==='error'?'border-red-400/20 bg-red-500/10 text-red-200':type==='success'?'border-emerald-400/20 bg-emerald-500/10 text-emerald-200':'border-violet-400/20 bg-violet-500/10 text-violet-200'}`;clearTimeout(show.t);show.t=setTimeout(()=>{$('message').className='hidden'},3500)}
async function load(){try{const [a,b]=await Promise.all([fetch('/api/avatars/catalog',{headers}),fetch('/api/avatars/me',{headers})]);if(!a.ok||!b.ok){localStorage.removeItem('karhoot_token');location.href='/login.html';return}const catalog=await a.json(),me=await b.json();state.items=catalog.items||[];state.coins=me.user?.coins??100;state.config={...state.config,...(me.config||{}),options:{...(me.config?.options||{})}};$('coins').textContent=state.coins;renderTabs();renderPreview();renderShop()}catch(error){show('Impossible de charger la boutique.','error');console.error(error)}}
load();
</script></body></html>
