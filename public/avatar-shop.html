<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avatar Studio — Karhoot</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{violetx:'#7c3aed',ink:'#08070d'}}}}</script>
<style>body{background:#08070d}.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1)}.card:hover{transform:translateY(-3px);border-color:rgba(139,92,246,.7)}.card{transition:.2s}</style>
</head>
<body class="min-h-screen text-white">
<header class="sticky top-0 z-20 border-b border-white/10 bg-[#08070d]/85 backdrop-blur-xl"><div class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between"><a href="/student.html" class="font-black text-xl">K<span class="text-violet-400">.</span> Karhoot</a><div class="flex items-center gap-4"><span id="coins" class="font-black">🪙 0</span><a href="/student.html" class="text-sm text-white/60 hover:text-white">Retour</a></div></div></header>
<main class="max-w-7xl mx-auto px-5 py-8">
<section class="grid lg:grid-cols-[360px_1fr] gap-6 mb-8">
<div class="glass rounded-[2rem] p-7 sticky top-24 h-fit"><p class="text-violet-300 text-xs font-black uppercase tracking-[.25em]">Avatar Studio</p><h1 class="text-4xl font-black mt-2">Crée ton identité.</h1><p class="text-white/50 mt-2">Choisis ton personnage, tes cosmétiques et ton ambiance.</p><div class="mt-6 rounded-3xl bg-gradient-to-br from-violet-600/30 via-white/5 to-black p-5"><div class="aspect-square rounded-3xl bg-white/90 flex items-center justify-center overflow-hidden"><img id="preview" class="w-full h-full object-cover" alt="Avatar"></div></div><div class="mt-5 grid grid-cols-3 gap-2"><button data-bg="" class="bg-white text-black rounded-xl py-2 text-xs font-bold" onclick="setBackground('')">Blanc</button><button data-bg="midnight" class="bg-black border border-white/20 rounded-xl py-2 text-xs font-bold" onclick="setBackground('midnight')">Noir</button><button data-bg="neon" class="bg-violet-600 rounded-xl py-2 text-xs font-bold" onclick="setBackground('neon')">Violet</button></div><button onclick="saveAvatar()" class="w-full mt-4 rounded-2xl bg-violet-600 hover:bg-violet-500 py-4 font-black">Équiper l'avatar</button><p id="message" class="text-center text-sm mt-3 min-h-5 text-white/60"></p></div>
<div><div class="flex flex-wrap gap-2 mb-5"><button class="tab px-4 py-2 rounded-xl bg-violet-600 font-bold" data-tab="character">Personnages</button><button class="tab px-4 py-2 rounded-xl bg-white/5 font-bold" data-tab="outfit">Tenues</button><button class="tab px-4 py-2 rounded-xl bg-white/5 font-bold" data-tab="background">Ambiances</button></div><div id="grid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4"></div></div>
</section></main>
<script>
const token=localStorage.getItem('karhoot_token'); if(!token) location.href='/login.html';
let items=[],config={character:'lorelei-default',outfit:'',background:''},coins=0,tab='character';
const headers={'Content-Type':'application/json',Authorization:`Bearer ${token}`};
function dice(style,seed,background){const bg=background==='neon'?'c084fc':background==='midnight'?'111827':'ffffff';return `https://api.dicebear.com/10.x/${encodeURIComponent(style)}/svg?seed=${encodeURIComponent(seed)}&backgroundColor=${bg}&radius=28`;}
async function load(){const r=await fetch('/api/avatars/catalog',{headers});const d=await r.json();if(!r.ok){location.href='/login.html';return}items=d.items;const me=await fetch('/api/avatars/me',{headers}).then(x=>x.json());coins=me.user.coins;config=me.config;render();}
function render(){coinsEl.textContent='🪙 '+coins; const list=items.filter(x=>x.category===tab);grid.innerHTML=list.map(x=>{const active=config.character===x.slug||config.outfit===x.slug||config.background===x.slug;const owned=x.owned;return `<article class="card glass rounded-3xl p-4 ${active?'ring-2 ring-violet-500':''}"><div class="aspect-square rounded-2xl bg-white/90 overflow-hidden flex items-center justify-center"><img class="w-full h-full object-cover" src="${dice(x.style,x.slug,tab==='background'?x.slug:config.background)}"></div><div class="mt-4"><div class="flex justify-between gap-2"><h2 class="font-black">${x.icon} ${x.name}</h2><span class="text-xs font-black ${owned?'text-emerald-300':'text-violet-300'}">${owned?'Possédé':'🪙 '+x.price}</span></div><p class="text-xs text-white/45 mt-1">${x.description}</p><button class="w-full mt-3 py-2.5 rounded-xl ${owned?'bg-white/10 hover:bg-white/15':'bg-violet-600 hover:bg-violet-500'} font-bold text-sm" onclick="${owned?`equipLocal('${x.category}','${x.slug}')`:`buy('${x.slug}')`}">${owned?(active?'Équipé ✓':'Équiper'):'Acheter'}</button></div></article>`}).join('');preview.src=dice((items.find(x=>x.slug===config.character)||{style:'lorelei'}).style,config.character+'-'+(config.outfit||'none'),config.background);}
function equipLocal(category,slug){if(category==='character')config.character=slug;if(category==='outfit')config.outfit=slug;if(category==='background')config.background=slug;render();}
function setBackground(slug){config.background=slug;render();}
async function buy(slug){const r=await fetch('/api/avatars/purchase',{method:'POST',headers,body:JSON.stringify({slug})});const d=await r.json();message.textContent=d.error||'Achat effectué !';if(r.ok){coins=d.coins;const x=items.find(i=>i.slug===slug);x.owned=true;equipLocal(x.category,x.slug)}setTimeout(()=>message.textContent='',2500)}
async function saveAvatar(){const r=await fetch('/api/avatars/equip',{method:'POST',headers,body:JSON.stringify(config)});const d=await r.json();message.textContent=r.ok?'Avatar équipé ✨':d.error||'Erreur';if(r.ok){const u=JSON.parse(localStorage.getItem('karhoot_user')||'{}');u.avatar=d.avatar;u.avatar_config=config;u.coins=coins;localStorage.setItem('karhoot_user',JSON.stringify(u));}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.className='tab px-4 py-2 rounded-xl bg-white/5 font-bold');b.className='tab px-4 py-2 rounded-xl bg-violet-600 font-bold';render()});
const grid=document.getElementById('grid'),preview=document.getElementById('preview'),coinsEl=document.getElementById('coins'),message=document.getElementById('message');load();
</script></body></html>
