<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karhoot — Rejoindre</title><link rel="stylesheet" href="/tailwind.css"><link rel="stylesheet" href="/app.css"></head><body class="min-h-screen bg-slate-950 text-white grid place-items-center p-5" class="min-h-screen bg-slate-950 text-white grid place-items-center p-5 kh-shell"><div class="kh-orb one"></div><div class="kh-orb two"></div><main class="w-full max-w-md text-center"><div class="kh-brand-mark mx-auto" style="width:72px;height:72px;border-radius:24px"><img src="/brand-mark.svg" alt="" aria-hidden="true"></div><h1 class="text-5xl font-black mt-4 kh-gradient">Karhoot</h1><p id="subtitle" class="text-slate-400 mt-2">Connexion à ta partie…</p><div class="rounded-3xl border border-white/10 bg-white/5 p-6 mt-8"><div id="profile" class="hidden items-center gap-4 text-left rounded-2xl bg-white/5 border border-white/10 p-4"><img id="avatar" class="w-14 h-14 rounded-2xl bg-slate-900 object-cover" alt="Avatar"><div class="min-w-0"><p class="text-xs uppercase tracking-widest text-slate-500">Ton profil</p><p id="username" class="text-xl font-black truncate"></p><p class="text-sm text-slate-400">Ton compte sera utilisé automatiquement</p></div></div><div id="loading" class="py-8"><div class="mx-auto w-10 h-10 rounded-full border-4 border-white/10 border-t-indigo-400 animate-spin"></div><p class="text-slate-400 mt-4">Préparation de ton profil…</p></div><div id="errorBox" class="hidden"><p id="error" class="text-rose-300"></p><a id="back" href="/student.html" class="inline-block mt-5 px-5 py-3 rounded-2xl bg-white/10 hover:bg-white/15 font-bold">Retour à mon espace</a></div></div></main><script>const token=localStorage.getItem('karhoot_token'),storedUser=JSON.parse(localStorage.getItem('karhoot_user')||'{}'),params=new URLSearchParams(location.search),room=(params.get('room')||params.get('code')||'').trim().toUpperCase();const $=id=>document.getElementById(id);function fail(message,login=false){$('loading').classList.add('hidden');$('profile').classList.add('hidden');$('errorBox').classList.remove('hidden');$('error').textContent=message;if(login){$('back').href='/login.html?redirect='+encodeURIComponent(location.pathname+location.search);$('back').textContent='Se connecter'}}async function join(){if(!token)return fail('Connecte-toi à ton compte Karhoot pour rejoindre cette partie.',true);if(storedUser.role!=='student')return fail('Cette page est réservée aux comptes élèves.');if(!/^[A-Z0-9]{6}$/.test(room))return fail('Le code de partie est invalide.');$('username').textContent=storedUser.username||'Élève';$('avatar').src='https://api.dicebear.com/10.x/toon-head/svg?seed='+encodeURIComponent(storedUser.username||storedUser.id||'karhoot')+'&radius=28';$('profile').classList.remove('hidden');$('profile').classList.add('flex');$('subtitle').textContent='Partie '+room+' • connexion avec ton profil';try{const r=await fetch('/api/games/'+encodeURIComponent(room)+'/join',{method:'POST',headers:{Authorization:'Bearer '+token}});const d=await r.json().catch(()=>({}));if(r.status===401)return fail('Ta session a expiré. Connecte-toi à nouveau.',true);if(!r.ok)return fail(d.error||'Impossible de rejoindre cette partie.');location.href='/game.html?code='+encodeURIComponent(room)}catch{fail('Serveur indisponible.')}}join();</script><script src="/app.js" defer></script></body></html>
