<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karhoot — Rejoindre</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-white grid place-items-center p-5"><main class="w-full max-w-md text-center"><div class="text-6xl">🎮</div><h1 class="text-5xl font-black mt-4">Karhoot</h1><p class="text-slate-400 mt-2">Entre le code donné par ton professeur.</p><div class="rounded-3xl border border-white/10 bg-white/5 p-6 mt-8"><input id="code" maxlength="6" class="w-full text-center uppercase tracking-[.35em] text-3xl font-black bg-slate-900 border border-white/10 rounded-2xl px-4 py-5" placeholder="ABC123"><input id="name" class="w-full mt-3 bg-slate-900 border border-white/10 rounded-2xl px-4 py-3" placeholder="Ton pseudo"><button onclick="join()" class="w-full mt-4 py-4 rounded-2xl bg-indigo-500 hover:bg-indigo-400 font-black">Rejoindre la partie</button><p id="error" class="text-rose-300 mt-4"></p></div></main><script>const token=localStorage.getItem('karhoot_token');if(!token)document.getElementById('name').value='';async function join(){const code=document.getElementById('code').value.trim().toUpperCase();if(!code)return;const r=await fetch('/api/games/'+encodeURIComponent(code),{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)return document.getElementById('error').textContent=d.error||'Partie introuvable';location.href='/game.html?code='+encodeURIComponent(code)}</script></body></html>
