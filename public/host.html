<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karhoot — Partie</title><script src="https://cdn.tailwindcss.com"></script><script src="/socket.io/socket.io.js"></script><style>.avatar-stage{position:relative;width:56px;height:56px;border-radius:16px;background:#fff;overflow:hidden}.avatar-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.player-card{transition:transform .18s,border-color .18s}.player-card:hover{transform:translateY(-2px);border-color:rgba(139,92,246,.5)}</style></head><body class="min-h-screen bg-[#08070d] text-white"><main class="max-w-6xl mx-auto p-5 md:p-10"><div class="flex justify-between items-center"><a href="/teacher.html" class="font-black text-2xl">K<span class="text-violet-400">.</span> Karhoot</a><div class="text-white/45">Code <b id="code" class="text-white tracking-widest"></b></div></div><section id="lobby" class="text-center mt-12"><p class="text-white/40 font-bold">REJOIGNEZ SUR /JOIN</p><div class="text-7xl md:text-9xl font-black tracking-widest text-violet-400 mt-2" id="bigCode">---</div><p id="status" class="text-white/45 mt-4">En attente des joueurs…</p><button id="start" onclick="startGame()" class="mt-8 px-8 py-4 rounded-2xl bg-violet-600 font-black text-lg">🚀 Commencer</button></section><section id="question" class="hidden mt-10 text-center"><p id="meta" class="text-violet-300 font-bold"></p><h1 id="qtext" class="text-4xl font-black mt-3"></h1><div id="answers" class="grid md:grid-cols-2 gap-3 mt-7"></div><div class="flex justify-center gap-3 mt-8"><button onclick="nextQuestion()" class="px-6 py-3 rounded-xl bg-violet-600 font-bold">Question suivante →</button><button onclick="endGame()" class="px-6 py-3 rounded-xl bg-rose-500/20 text-rose-300 font-bold">Terminer</button></div></section><section class="mt-12 rounded-3xl border border-white/10 bg-white/5 p-6"><div class="flex justify-between"><h2 class="text-xl font-bold">Joueurs</h2><span id="count" class="text-white/40">0</span></div><div id="players" class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 mt-5"></div></section></main><script>
const token=localStorage.getItem('karhoot_token'),user=JSON.parse(localStorage.getItem('karhoot_user')||'{}'),params=new URLSearchParams(location.search),code=(params.get('code')||params.get('room')||'').trim().toUpperCase();
if(!token||!['teacher','admin'].includes(user.role))location.href='/login.html';
document.getElementById('code').textContent=code||'---';document.getElementById('bigCode').textContent=code||'---';
const socket=io({auth:{token}});socket.on('connect',()=>socket.emit('join-room',{roomCode:code}));socket.on('connect_error',e=>alert(e.message));socket.on('lobby-update',renderPlayers);socket.on('room-error',m=>alert(m));
function dicebearUrl(p){const c=p.avatarConfig||{};const style=c.character||p.avatar||'toon-head';const u=new URL(`https://api.dicebear.com/10.x/${encodeURIComponent(style)}/svg`);u.searchParams.set('seed',c.seed||p.username||'karhoot');u.searchParams.set('backgroundColor','ffffff');u.searchParams.set('borderRadius','28');for(const[k,v]of Object.entries(c.options||{})){if(v!==''&&v!==null&&v!==undefined)u.searchParams.set(k,String(v))}return u.toString()}
function layerStyle(c){const scale=Number(c.scale??100)/100,rotation=Number(c.rotation??0),x=Number(c.posX??50),y=Number(c.posY??50);let ty=y;if(c.anchor==='head')ty=y-14;else if(c.anchor==='face')ty=y-7;else if(c.anchor==='body')ty=y+8;else if(c.anchor==='feet')ty=y+25;return `left:${x}%;top:${ty}%;transform:translate(-50%,-50%) scale(${scale}) rotate(${rotation}deg)`}
function avatarHtml(p){const c=p.avatarConfig||{};const cosmetics=Array.isArray(c.cosmetics)?c.cosmetics:[];return `<div class="avatar-stage"><img class="avatar-layer p-1" src="${dicebearUrl(p)}" alt="Avatar de ${escapeHtml(p.username)}">${cosmetics.map(x=>`<img class="avatar-layer" src="/api/avatars/custom/${encodeURIComponent(x.slug)}.svg" style="${layerStyle(x)}" alt="${escapeHtml(x.name||'Cosmétique')}">`).join('')}</div>`}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])}
function renderPlayers(players){document.getElementById('count').textContent=players.length;document.getElementById('status').textContent=players.length?`${players.length} joueur${players.length>1?'s':''} connecté${players.length>1?'s':''}`:'En attente des joueurs…';document.getElementById('players').innerHTML=players.map(p=>`<div class="player-card rounded-2xl bg-black/40 border border-white/10 p-4"><div class="flex items-center gap-3">${avatarHtml(p)}<div class="min-w-0"><div class="font-bold truncate">${escapeHtml(p.username)}</div><div class="text-xs text-white/40">${Number(p.score||0)} pts</div></div></div></div>`).join('')}
async function startGame(){const r=await fetch('/api/games/'+encodeURIComponent(code)+'/start',{method:'POST',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)return alert(d.error||'Impossible');showQuestion(d.question);socket.emit('game-state',{roomCode:code,question:d.question})}
async function nextQuestion(){const r=await fetch('/api/games/'+encodeURIComponent(code)+'/next',{method:'POST',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)return alert(d.error||'Erreur');if(d.finished)return finish();showQuestion(d.question);socket.emit('game-state',{roomCode:code,question:d.question})}
async function endGame(){await fetch('/api/games/'+encodeURIComponent(code)+'/end',{method:'POST',headers:{Authorization:'Bearer '+token}});finish()}
function finish(){document.getElementById('question').classList.add('hidden');document.getElementById('lobby').classList.add('hidden');socket.emit('game-state',{roomCode:code,finished:true})}
function showQuestion(q){document.getElementById('lobby').classList.add('hidden');document.getElementById('question').classList.remove('hidden');document.getElementById('meta').textContent=q.points+' points';document.getElementById('qtext').textContent=q.question;document.getElementById('answers').innerHTML=q.answers.map(a=>`<div class="p-4 rounded-2xl bg-black/40 border border-white/10 text-left font-bold">${escapeHtml(a.answer)}</div>`).join('')}
</script></body></html>
