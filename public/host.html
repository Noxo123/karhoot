<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karhoot — Partie</title><script src="https://cdn.tailwindcss.com"></script><script src="/socket.io/socket.io.js"></script></head><body class="min-h-screen bg-slate-950 text-white"><main class="max-w-6xl mx-auto p-5 md:p-10"><div class="flex justify-between items-center"><a href="/teacher.html" class="font-black text-2xl">🎮 Karhoot</a><div class="text-slate-400">Code <b id="code" class="text-white tracking-widest"></b></div></div><section id="lobby" class="text-center mt-12"><p class="text-slate-500 font-bold">REJOIGNEZ SUR /JOIN</p><div class="text-7xl md:text-9xl font-black tracking-widest text-indigo-400 mt-2" id="bigCode">---</div><p id="status" class="text-slate-400 mt-4">En attente des joueurs…</p><button id="start" onclick="startGame()" class="mt-8 px-8 py-4 rounded-2xl bg-emerald-500 font-black text-lg">🚀 Commencer</button></section><section id="question" class="hidden mt-10 text-center"><p id="meta" class="text-indigo-300 font-bold"></p><h1 id="qtext" class="text-4xl font-black mt-3"></h1><div id="answers" class="grid md:grid-cols-2 gap-3 mt-7"></div><div class="flex justify-center gap-3 mt-8"><button onclick="nextQuestion()" class="px-6 py-3 rounded-xl bg-indigo-500 font-bold">Question suivante →</button><button onclick="endGame()" class="px-6 py-3 rounded-xl bg-rose-500/20 text-rose-300 font-bold">Terminer</button></div></section><section class="mt-12 rounded-3xl border border-white/10 bg-white/5 p-6"><div class="flex justify-between"><h2 class="text-xl font-bold">Joueurs</h2><span id="count" class="text-slate-500">0</span></div><div id="players" class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 mt-5"></div></section></main><script>const token=localStorage.getItem('karhoot_token'),user=JSON.parse(localStorage.getItem('karhoot_user')||'{}'),code=new URLSearchParams(location.search).get('code');if(!token||!['teacher','admin'].includes(user.role))location.href='/login.html';document.getElementById('code').textContent=code||'---';document.getElementById('bigCode').textContent=code||'---';const socket=io();socket.on('connect',()=>socket.emit('join-room',{roomCode:code,userId:user.id,token}));socket.on('lobby-update',renderPlayers);socket.on('room-error',m=>alert(m));async function startGame(){const r=await fetch('/api/games/'+encodeURIComponent(code)+'/start',{method:'POST',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)return alert(d.error||'Impossible');showQuestion(d.question);socket.emit('game-state',{roomCode:code,question:d.question})}async function nextQuestion(){const r=await fetch('/api/games/'+encodeURIComponent(code)+'/next',{method:'POST',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)return alert(d.error||'Erreur');if(d.finished)return finish();showQuestion(d.question);socket.emit('game-state',{roomCode:code,question:d.question})}async function endGame(){await fetch('/api/games/'+encodeURIComponent(code)+'/end',{method:'POST',headers:{Authorization:'Bearer '+token}});finish()}function finish(){document.getElementById('question').classList.add('hidden');document.getElementById('lobby').classList.add('hidden');socket.emit('game-state',{roomCode:code,finished:true})}function showQuestion(q){document.getElementById('lobby').classList.add('hidden');document.getElementById('question').classList.remove('hidden');document.getElementById('meta').textContent=q.points+' points';document.getElementById('qtext').textContent=q.question;document.getElementById('answers').innerHTML=q.answers.map(a=>`<div class="p-4 rounded-2xl bg-slate-900 border border-white/10 text-left font-bold">${a.answer}</div>`).join('')}function renderPlayers(players){document.getElementById('count').textContent=players.length;document.getElementById('status').textContent=players.length?`${players.length} joueur${players.length>1?'s':''} connecté${players.length>1?'s':''}`:'En attente des joueurs…';document.getElementById('players').innerHTML=players.map(p=>`<div class="rounded-2xl bg-slate-900 border border-white/10 p-4"><div class="text-3xl">${p.avatar==='robot'?'🤖':'🚀'}</div><div class="font-bold mt-2">${p.username}</div><div class="text-xs text-slate-500">${p.score} pts</div></div>`).join('')}</script></body></html>
