<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karhoot — Créer un quiz</title><link rel="stylesheet" href="/tailwind.css"><link rel="stylesheet" href="/app.css"></head><body class="min-h-screen bg-slate-950 text-white min-h-screen bg-slate-950 text-white kh-shell"><div class="kh-orb one"></div><div class="kh-orb two"></div><header class="border-b border-white/10"><div class="max-w-5xl mx-auto p-5 flex justify-between"><a href="/teacher.html" class="font-black text-2xl">🎮 Karhoot</a><button onclick="save()" class="px-5 py-2.5 rounded-xl bg-indigo-500 font-bold">Publier le quiz</button></div></header><main class="max-w-5xl mx-auto p-5 md:p-8"><h1 class="text-4xl font-black">Nouveau quiz 🧠</h1><p class="text-slate-400 mt-2">Chaque question peut contenir jusqu'à 8 réponses.</p><section class="rounded-3xl border border-white/10 bg-white/5 p-5 mt-8"><input id="title" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-xl font-bold" placeholder="Titre du quiz"><textarea id="description" class="w-full mt-3 bg-slate-900 border border-white/10 rounded-xl px-4 py-3" placeholder="Description (optionnelle)"></textarea></section><div id="questions" class="space-y-5 mt-6"></div><button onclick="addQuestion()" class="w-full py-4 rounded-2xl border border-dashed border-white/20 text-slate-300 hover:bg-white/5">＋ Ajouter une question</button></main><script src="/js/teacher-nav.js"></script><script>const token=localStorage.getItem('karhoot_token'),user=JSON.parse(localStorage.getItem('karhoot_user')||'{}');if(!token||!['teacher','admin'].includes(user.role))location.href='/login.html';let questions=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function addQuestion(){questions.push({question:'',points:100,answers:[{answer:'',isCorrect:false},{answer:'',isCorrect:false},{answer:'',isCorrect:false},{answer:'',isCorrect:false}]});render()}function render(){document.getElementById('questions').innerHTML=questions.map((q,i)=>`<article class="rounded-3xl border border-white/10 bg-white/5 p-5"><div class="flex justify-between items-center"><h2 class="font-black text-xl">Question ${i+1}</h2><button onclick="questions.splice(${i},1);render()" class="text-rose-300">Supprimer</button></div><input data-q="${i}" class="q w-full mt-4 bg-slate-900 border border-white/10 rounded-xl px-4 py-3" placeholder="Écris ta question" value="${esc(q.question)}"><div class="grid md:grid-cols-2 gap-3 mt-4">${q.answers.map((a,j)=>`<label class="flex items-center gap-3 bg-slate-900 rounded-xl p-3"><input type="radio" name="correct-${i}" ${a.isCorrect?'checked':''} onchange="setCorrect(${i},${j})"><input data-a="${i}-${j}" class="a flex-1 bg-transparent outline-none" placeholder="Réponse ${j+1}" value="${esc(a.answer)}"></label>`).join('')}</div><div class="mt-3 text-sm text-slate-500">Choisis une bonne réponse. Points : ${q.points}</div></article>`).join('');document.querySelectorAll('.q').forEach(e=>e.oninput=()=>questions[e.dataset.q].question=e.value);document.querySelectorAll('.a').forEach(e=>e.oninput=()=>{const [i,j]=e.dataset.a.split('-').map(Number);questions[i].answers[j].answer=e.value})}function setCorrect(i,j){questions[i].answers.forEach((a,k)=>a.isCorrect=k===j)}async function save(){const title=document.getElementById('title').value.trim();if(!title||!questions.length)return alert('Ajoute un titre et au moins une question.');for(const q of questions){if(!q.question.trim()||q.answers.filter(a=>a.answer.trim()).length<2||!q.answers.some(a=>a.isCorrect))return alert('Chaque question doit avoir au moins 2 réponses et une bonne réponse.')}const r=await fetch('/api/quizzes',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({title,description:document.getElementById('description').value,questions})});const d=await r.json();if(!r.ok)return alert(d.error||'Erreur');location.href='/teacher.html'}addQuestion();</script><script src="/app.js" defer></script></body></html>
