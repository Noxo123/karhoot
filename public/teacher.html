<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace professeur — Karhoot</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-white"><header class="border-b border-white/10"><div class="max-w-6xl mx-auto p-5 flex justify-between"><a href="/" class="font-black text-2xl">🎮 Karhoot</a><button onclick="logout()" class="text-slate-400">Déconnexion</button></div></header><main class="max-w-6xl mx-auto p-6"><h1 id="hello" class="text-4xl font-black">Espace professeur 👨‍🏫</h1><p class="text-slate-400 mt-2">Crée des expériences que tes élèves auront envie de jouer.</p><section class="grid md:grid-cols-3 gap-5 mt-8"><div class="p-6 rounded-3xl bg-white/5 border border-white/10"><span class="text-3xl">📝</span><h2 class="text-xl font-bold mt-3">Créer un quiz</h2><p class="text-slate-400 mt-1">Construis tes questions et réponses.</p><button onclick="alert('Le quiz builder arrive dans la prochaine étape.')" class="mt-5 px-5 py-3 rounded-xl bg-indigo-500 font-bold">Nouveau quiz</button></div><div class="p-6 rounded-3xl bg-white/5 border border-white/10"><span class="text-3xl">👥</span><h2 class="text-xl font-bold mt-3">Mes classes</h2><p class="text-slate-400 mt-1">Crée une classe et partage son code.</p><button onclick="createClass()" class="mt-5 px-5 py-3 rounded-xl bg-white/10">Créer une classe</button></div><div class="p-6 rounded-3xl bg-white/5 border border-white/10"><span class="text-3xl">⚡</span><h2 class="text-xl font-bold mt-3">Partie live</h2><p class="text-slate-400 mt-1">Lance un quiz en temps réel.</p><button onclick="alert('Sélectionne un quiz pour lancer une partie.')" class="mt-5 px-5 py-3 rounded-xl bg-emerald-500 font-bold">Lancer</button></div></section><section class="mt-8 p-6 rounded-3xl bg-white/5 border border-white/10"><h2 class="text-2xl font-bold">Mes classes</h2><div id="classes" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-5"></div></section></main><script>const token=localStorage.getItem('karhoot_token');const user=JSON.parse(localStorage.getItem('karhoot_user')||'{}');if(!token||!['teacher','admin'].includes(user.role))location.href='/login.html';hello.textContent=`Bonjour ${user.username||''} 👨‍🏫`;const api=(u,o={})=>fetch(u,{...o,headers:{...o.headers,Authorization:'Bearer '+token,'Content-Type':'application/json'}});async function load(){const d=await (await api('/api/classes')).json();classes.innerHTML=(d.classes||[]).map(c=>`<div class="p-5 rounded-2xl bg-slate-900 border border-white/10"><b>${c.name}</b><div class="text-indigo-300 text-2xl font-black mt-2">${c.code}</div><small class="text-slate-500">${c.member_count||0} élèves</small></div>`).join('')||'<p class="text-slate-500">Aucune classe.</p>'}async function createClass(){const name=prompt('Nom de la classe');if(!name)return;await api('/api/classes',{method:'POST',body:JSON.stringify({name})});load()}function logout(){localStorage.clear();location.href='/'}load();</script></body></html>
