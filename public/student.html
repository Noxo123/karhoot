<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon espace — Karhoot</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#08070d}.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px)}.avatar-stage{position:relative;width:100%;height:100%}.avatar-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}</style></head><body class="min-h-screen text-white"><header class="border-b border-white/10 bg-[#08070d]/80 backdrop-blur-xl"><div class="max-w-6xl mx-auto p-5 flex justify-between items-center"><a href="/" class="font-black text-2xl">K<span class="text-violet-400">.</span> Karhoot</a><div class="flex items-center gap-4"><a href="/avatar-shop.html" class="text-sm font-bold text-violet-300">✨ Avatar Studio</a><button onclick="logout()" class="text-white/45 hover:text-white">Déconnexion</button></div></div></header><main class="max-w-6xl mx-auto p-6"><section class="rounded-[2rem] bg-gradient-to-br from-violet-700/30 via-white/5 to-black border border-white/10 p-8"><div class="flex flex-col sm:flex-row gap-6 items-center sm:items-start"><div class="w-28 h-28 rounded-3xl bg-white/90 overflow-hidden shadow-2xl"><div id="avatarStage" class="avatar-stage"></div></div><div class="flex-1 text-center sm:text-left"><p class="text-violet-300 text-xs font-black uppercase tracking-[.25em]">Espace élève</p><h1 id="hello" class="text-4xl font-black mt-2"></h1><p class="text-white/45 mt-2">Prêt pour ton prochain défi ?</p><div class="mt-6 flex justify-center sm:justify-start gap-8"><div><b id="xp">0</b><span class="text-white/45"> XP</span></div><div><b id="level">1</b><span class="text-white/45"> Niveau</span></div><div><b id="coins">0</b><span class="text-white/45"> 🪙</span></div></div></div></div></section><div class="grid md:grid-cols-2 gap-5 mt-6"><div class="glass p-6 rounded-3xl"><div class="text-3xl">🎮</div><h2 class="font-bold text-xl mt-3">Rejoindre une partie</h2><p class="text-white/45 mt-1">Entre le code donné par ton professeur.</p><div class="flex gap-2 mt-5"><input id="room" maxlength="6" placeholder="ABC123" class="flex-1 p-3 rounded-xl bg-black/40 border border-white/10 uppercase"><button onclick="join()" class="px-5 rounded-xl bg-violet-600 font-bold">Rejoindre</button></div></div><div class="glass p-6 rounded-3xl"><div class="text-3xl">✨</div><h2 class="font-bold text-xl mt-3">Personnalise ton avatar</h2><p class="text-white/45 mt-1">Personnages, tenues, cheveux, yeux et couleurs sauvegardés sur ton compte.</p><a href="/avatar-shop.html" class="inline-block mt-5 px-5 py-3 rounded-xl bg-white text-black font-black">Ouvrir le Studio →</a></div></div></main><script>
const token=localStorage.getItem('karhoot_token');if(!token)location.href='/login.html';
let user=JSON.parse(localStorage.getItem('karhoot_user')||'{}');
const config=user.avatar_config||{};
function item(slug){return (config.catalog||[]).find(x=>x.slug===slug)||null}
function layerStyle(item){const scale=Number(item?.scale??100)/100;const rotation=Number(item?.rotation??0);let x=Number(item?.posX??50),y=Number(item?.posY??50);if(item?.anchor==='head')y-=14;else if(item?.anchor==='face')y-=7;else if(item?.anchor==='body')y+=8;else if(item?.anchor==='feet')y+=25;return `left:${x}%;top:${y}%;transform:translate(-50%,-50%) scale(${scale}) rotate(${rotation}deg)`}
function avatarUrl(){const style=user.avatar||'toon-head';const bgMap={neon:'c084fc',midnight:'111827',snow:'f8fafc'};const url=new URL(`https://api.dicebear.com/10.x/${encodeURIComponent(style)}/svg`);url.searchParams.set('seed',config.seed||user.username||'player');url.searchParams.set('backgroundColor',bgMap[config.background]||'ffffff');url.searchParams.set('borderRadius','28');for(const[key,value]of Object.entries(config.options||{})){if(value!==''&&value!==null&&value!==undefined)url.searchParams.set(key,String(value))}return url.toString()}
function renderAvatar(){const stage=document.getElementById('avatarStage');stage.innerHTML='';const base=document.createElement('img');base.className='avatar-layer';base.src=avatarUrl();base.alt='Avatar';stage.appendChild(base);for(const cosmetic of (config.catalog||[]).filter(x=>(config.cosmetics||[]).includes(x.slug)&&x.hasSvg)){const img=document.createElement('img');img.className='avatar-layer';img.src=`/api/avatars/custom/${encodeURIComponent(cosmetic.slug)}.svg`;img.alt=cosmetic.name||'Cosmétique';img.style.cssText=layerStyle(cosmetic);stage.appendChild(img)}}
hello.textContent=`Salut ${user.username||'joueur'} 👋`;xp.textContent=user.xp||0;level.textContent=user.level||1;coins.textContent=user.coins??0;renderAvatar();
async function refreshUser(){try{const r=await fetch('/api/avatars/me',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const d=await r.json();user={...user,...d.user,avatar_config:d.config};const catalog=await fetch('/api/avatars/catalog',{headers});if(catalog.ok){const c=await catalog.json();user.avatar_config.catalog=c.items||[]}localStorage.setItem('karhoot_user',JSON.stringify(user));Object.assign(config,user.avatar_config||{});renderAvatar();coins.textContent=user.coins??0}catch(error){console.error(error)}}
refreshUser();
function logout(){localStorage.clear();location.href='/'}function join(){const c=room.value.trim().toUpperCase();if(c)location.href='/join.html?room='+encodeURIComponent(c)}
</script></body></html>
