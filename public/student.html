<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon espace — Karhoot</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-white"><header class="border-b border-white/10"><div class="max-w-6xl mx-auto p-5 flex justify-between"><a href="/" class="font-black text-2xl">🎮 Karhoot</a><button onclick="logout()" class="text-slate-400">Déconnexion</button></div></header><main class="max-w-6xl mx-auto p-6"><section class="rounded-3xl bg-gradient-to-br from-indigo-600/30 to-purple-600/10 border border-white/10 p-8"><div class="text-6xl">🧑‍🚀</div><h1 id="hello" class="text-4xl font-black mt-4"></h1><p class="text-slate-400 mt-2">Prêt pour ton prochain défi ?</p><div class="mt-7 flex gap-8"><div><b id="xp">0</b><span class="text-slate-400"> XP</span></div><div><b id="level">1</b><span class="text-slate-400"> Niveau</span></div><div><b>🔥 0</b><span class="text-slate-400"> Série</span></div></div></section><div class="grid md:grid-cols-2 gap-5 mt-6"><div class="p-6 rounded-3xl bg-white/5 border border-white/10"><div class="text-3xl">🎮</div><h2 class="font-bold text-xl mt-3">Rejoindre une partie</h2><p class="text-slate-400 mt-1">Entre le code donné par ton professeur.</p><div class="flex gap-2 mt-5"><input id="room" maxlength="6" placeholder="ABC123" class="flex-1 p-3 rounded-xl bg-slate-900 border border-white/10 uppercase"><button onclick="join()" class="px-5 rounded-xl bg-indigo-500 font-bold">Rejoindre</button></div></div><div class="p-6 rounded-3xl bg-white/5 border border-white/10"><div class="text-3xl">🏆</div><h2 class="font-bold text-xl mt-3">Ma progression</h2><p class="text-slate-400 mt-1">Gagne de l'XP en participant aux quiz.</p><div class="mt-5 h-3 bg-white/10 rounded-full"><div class="h-3 w-1/3 bg-indigo-400 rounded-full"></div></div></div></div></main><script>const token=localStorage.getItem('karhoot_token');if(!token)location.href='/login.html';const user=JSON.parse(localStorage.getItem('karhoot_user')||'{}');hello.textContent=`Salut ${user.username||'joueur'} 👋`;xp.textContent=user.xp||0;level.textContent=user.level||1;function logout(){localStorage.clear();location.href='/'}function join(){const c=room.value.trim().toUpperCase();if(c)location.href='/join.html?room='+encodeURIComponent(c)}</script></body></html>
