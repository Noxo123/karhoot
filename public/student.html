<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon espace — Karhoot</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#08070d}.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px)}</style></head><body class="min-h-screen text-white"><header class="border-b border-white/10 bg-[#08070d]/80 backdrop-blur-xl"><div class="max-w-6xl mx-auto p-5 flex justify-between items-center"><a href="/" class="font-black text-2xl">K<span class="text-violet-400">.</span> Karhoot</a><div class="flex items-center gap-4"><a href="/avatar-shop.html" class="text-sm font-bold text-violet-300">✨ Avatar Studio</a><button onclick="logout()" class="text-white/45 hover:text-white">Déconnexion</button></div></div></header><main class="max-w-6xl mx-auto p-6"><section class="rounded-[2rem] bg-gradient-to-br from-violet-700/30 via-white/5 to-black border border-white/10 p-8"><div class="flex flex-col sm:flex-row gap-6 items-center sm:items-start"><div class="w-28 h-28 rounded-3xl bg-white/90 overflow-hidden shadow-2xl"><img id="avatar" class="w-full h-full object-cover" alt="Avatar"></div><div class="flex-1 text-center sm:text-left"><p class="text-violet-300 text-xs font-black uppercase tracking-[.25em]">Espace élève</p><h1 id="hello" class="text-4xl font-black mt-2"></h1><p class="text-white/45 mt-2">Prêt pour ton prochain défi ?</p><div class="mt-6 flex justify-center sm:justify-start gap-8"><div><b id="xp">0</b><span class="text-white/45"> XP</span></div><div><b id="level">1</b><span class="text-white/45"> Niveau</span></div><div><b id="coins">0</b><span class="text-white/45"> 🪙</span></div></div></div></div></section><div class="grid md:grid-cols-2 gap-5 mt-6"><div class="glass p-6 rounded-3xl"><div class="text-3xl">🎮</div><h2 class="font-bold text-xl mt-3">Rejoindre une partie</h2><p class="text-white/45 mt-1">Entre le code donné par ton professeur.</p><div class="flex gap-2 mt-5"><input id="room" maxlength="6" placeholder="ABC123" class="flex-1 p-3 rounded-xl bg-black/40 border border-white/10 uppercase"><button onclick="join()" class="px-5 rounded-xl bg-violet-600 font-bold">Rejoindre</button></div></div><div class="glass p-6 rounded-3xl"><div class="text-3xl">✨</div><h2 class="font-bold text-xl mt-3">Personnalise ton avatar</h2><p class="text-white/45 mt-1">Personnages, tenues et ambiances à débloquer avec tes pièces.</p><a href="/avatar-shop.html" class="inline-block mt-5 px-5 py-3 rounded-xl bg-white text-black font-black">Ouvrir le Studio →</a></div></div></main><script>const token=localStorage.getItem('karhoot_token');if(!token)location.href='/login.html';let user=JSON.parse(localStorage.getItem('karhoot_user')||'{}');const avatarConfig=user.avatar_config||{};function avatarUrl(){const style=user.avatar||'lorelei';const bg=avatarConfig.background==='neon'?'c084fc':avatarConfig.background==='midnight'?'111827':'ffffff';return `https://api.dicebear.com/10.x/${style}/svg?seed=${encodeURIComponent((user.username||'player')+'-'+(avatarConfig.outfit||'none'))}&backgroundColor=${bg}&radius=28`}hello.textContent=`Salut ${user.username||'joueur'} 👋`;xp.textContent=user.xp||0;level.textContent=user.level||1;coins.textContent=user.coins??0;avatar.src=avatarUrl();function logout(){localStorage.clear();location.href='/'}function join(){const c=room.value.trim().toUpperCase();if(c)location.href='/join.html?room='+encodeURIComponent(c)}</script></body></html>
