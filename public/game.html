<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karhoot — Partie</title><link rel="stylesheet" href="/tailwind.css"><link rel="stylesheet" href="/app.css"><script src="/socket.io/socket.io.js"></script>
<style>
.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.live-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.055);border-radius:999px;font-size:12px;font-weight:900}.live-dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 14px #34d399}.score-pill{padding:10px 16px;border-radius:16px;background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.35);font-weight:900}.progress-track{height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.progress-fill{height:100%;width:100%;background:linear-gradient(90deg,#22d3ee,#8b5cf6,#f472b6);transition:width .15s linear}.timer{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:#080812;border:5px solid rgba(255,255,255,.1);font-size:24px;font-weight:1000}.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.answer-choice{position:relative;min-height:150px;border:0;border-radius:24px;padding:22px 24px;display:flex;align-items:center;gap:18px;text-align:left;color:#fff;cursor:pointer;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.18);transition:transform .16s,filter .16s,opacity .16s}.answer-choice:hover:not(:disabled){transform:translateY(-4px) scale(1.01);filter:brightness(1.08)}.answer-choice:disabled{cursor:default}.answer-choice .shape{width:54px;height:54px;flex:0 0 54px;display:grid;place-items:center;background:rgba(0,0,0,.2);font-size:25px;font-weight:1000}.answer-choice .letter{position:absolute;right:18px;top:14px;font-size:12px;font-weight:1000;opacity:.7}.answer-choice .answer-text{font-size:20px;font-weight:900;line-height:1.25}.answer-a{background:linear-gradient(135deg,#e84b55,#b82d45)}.answer-b{background:linear-gradient(135deg,#28a9e0,#1876bd)}.answer-c{background:linear-gradient(135deg,#f3a623,#db6e13)}.answer-d{background:linear-gradient(135deg,#2fbf71,#168553)}.answer-a .shape{border-radius:14px}.answer-b .shape{border-radius:50%}.answer-c .shape{clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:8px}.answer-d .shape{transform:rotate(45deg);border-radius:9px}.answer-d .shape span{transform:rotate(-45deg)}.answer-choice.correct{outline:4px solid rgba(255,255,255,.9);box-shadow:0 0 0 8px rgba(52,211,153,.2),0 22px 70px rgba(52,211,153,.25)}.answer-choice.wrong{filter:grayscale(.45) brightness(.65);opacity:.7}.feedback{min-height:52px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:1000}.state-card{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);border-radius:28px;padding:28px;text-align:center}@media(max-width:700px){.answer-grid{grid-template-columns:1fr;gap:10px}.answer-choice{min-height:105px;padding:16px 18px}.answer-choice .shape{width:46px;height:46px;flex-basis:46px}.answer-choice .answer-text{font-size:17px}.timer{width:60px;height:60px;font-size:20px}}
</style></head>
<body class="min-h-screen text-white kh-shell"><div class="kh-orb one"></div><div class="kh-orb two"></div>
<main class="max-w-5xl mx-auto p-4 md:p-8">
<header class="game-top"><a href="/student.html" class="kh-brand"><span class="kh-brand-mark"><img src="/brand-mark.svg" alt="" aria-hidden="true"></span><span>Karhoot</span></a><div class="flex items-center gap-2"><span class="live-pill"><span class="live-dot"></span><span id="roomLabel">PARTIE</span></span><span id="score" class="score-pill">0 XP</span></div></header>
<div id="reconnect" class="hidden mt-4 rounded-2xl border border-cyan-400/20 bg-cyan-400/10 px-4 py-3 text-sm font-bold">🔄 Reconnexion à la partie…</div>
<section id="waiting" class="state-card mt-12 md:mt-20"><div class="text-6xl md:text-7xl kh-breathe">🎮</div><h1 class="text-3xl md:text-5xl font-black mt-5 kh-gradient">Tu es dans la partie !</h1><p id="waitingText" class="text-white/55 mt-3">Le professeur prépare la prochaine question.</p><div class="mt-7 flex justify-center gap-3 flex-wrap"><span class="kh-badge">Code <b id="roomCode">------</b></span><span class="kh-badge">Progression sauvegardée</span></div></section>
<section id="question" class="hidden mt-8"><div class="flex items-center justify-between gap-4 mb-5"><div class="min-w-0"><div class="flex items-center gap-3 flex-wrap"><span id="meta" class="kh-badge">Question</span><span id="answerState" class="text-sm text-white/45"></span></div><div class="progress-track mt-4"><div id="progress" class="progress-fill"></div></div></div><div id="timer" class="timer shrink-0">30</div></div><h1 id="text" class="text-3xl md:text-5xl font-black leading-tight text-center md:text-left"></h1><div id="answers" class="answer-grid"></div><div id="result" class="feedback mt-2"></div></section>
<section id="finished" class="hidden state-card mt-12 md:mt-20"><div class="text-7xl kh-breathe">🏆</div><h1 class="text-4xl md:text-6xl font-black mt-5">Partie terminée !</h1><p id="final" class="text-white/55 mt-3"></p><a href="/student.html" class="inline-flex mt-7 px-6 py-3 rounded-2xl bg-violet-600 font-black">Retour à mon espace</a></section>
</main>
<script>
const token=localStorage.getItem('karhoot_token'),user=JSON.parse(localStorage.getItem('karhoot_user')||'{}'),params=new URLSearchParams(location.search),code=(params.get('code')||params.get('room')||'').trim().toUpperCase(),$=id=>document.getElementById(id);
const shapes=['◆','●','▲','■'],classes=['answer-a','answer-b','answer-c','answer-d'],QUESTION_TIME=30;let score=0,answered=false,currentQuestionId=null,timerId=null,socket=null;
if(!token||user.role!=='student')location.href='/login.html';if(code)localStorage.setItem('karhoot_active_game',code);$('roomLabel').textContent=code||'PARTIE';$('roomCode').textContent=code||'------';
function headers(json=false){const h={Authorization:'Bearer '+token};if(json)h['Content-Type']='application/json';return h}
async function api(url,o={}){const r=await fetch(url,{...o,headers:{...headers(Boolean(o.body)),...(o.headers||{})}});if(r.status===401){localStorage.removeItem('karhoot_token');localStorage.removeItem('karhoot_user');location.href='/login.html?reason=session-expired';throw Error('session')};return r}
function waiting(t){$('question').classList.add('hidden');$('finished').classList.add('hidden');$('waiting').classList.remove('hidden');$('waitingText').textContent=t}
function finished(){if(localStorage.getItem('karhoot_active_game')===code)localStorage.removeItem('karhoot_active_game');clearInterval(timerId);$('waiting').classList.add('hidden');$('question').classList.add('hidden');$('finished').classList.remove('hidden');$('final').textContent='Score final : '+score+' XP'}
function timer(started){clearInterval(timerId);const start=new Date(started||Date.now()).getTime();const tick=()=>{const left=Math.max(0,QUESTION_TIME-(Date.now()-start)/1000);$('timer').textContent=Math.ceil(left);$('progress').style.width=Math.max(0,left/QUESTION_TIME*100)+'%';if(left<=0){clearInterval(timerId);if(!answered){answered=true;$('answerState').textContent='Temps écoulé';$('result').textContent='⏱️ Temps écoulé — attends la prochaine question.';document.querySelectorAll('.answer-choice').forEach(b=>b.disabled=true)}}};tick();timerId=setInterval(tick,100)}
function showQuestion(q,old=null){if(!q)return;currentQuestionId=q.id;answered=Boolean(old);$('waiting').classList.add('hidden');$('finished').classList.add('hidden');$('question').classList.remove('hidden');$('meta').textContent='Question '+(Number(q.order_index)+1)+' · '+q.points+' XP';$('text').textContent=q.question;$('answerState').textContent=old?'Réponse verrouillée':'Choisis une réponse';$('result').textContent='';const box=$('answers');box.replaceChildren();q.answers.slice(0,4).forEach((a,i)=>{const b=document.createElement('button');b.type='button';b.className='answer-choice '+classes[i];b.disabled=answered;b.dataset.id=a.id;b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span class="shape"><span>'+shapes[i]+'</span></span><span class="answer-text"></span>';b.querySelector('.answer-text').textContent=a.answer;b.onclick=()=>answer(a.id,b);box.appendChild(b)});if(old){const chosen=box.querySelector('[data-id="'+CSS.escape(String(old.answerId))+'"]');if(chosen)chosen.classList.add(old.correct?'correct':'wrong');$('result').textContent=old.correct?'✅ Réponse déjà enregistrée · +'+old.points+' XP':'❌ Réponse déjà enregistrée'}timer(q.startedAt)}
async function answer(id,el){if(answered)return;answered=true;document.querySelectorAll('.answer-choice').forEach(b=>b.disabled=true);try{const r=await api('/api/games/'+encodeURIComponent(code)+'/answer',{method:'POST',headers:headers(true),body:JSON.stringify({answerId:id})}),d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===409&&d.correct!==undefined){$('result').textContent=d.correct?'✅ Réponse déjà enregistrée':'❌ Réponse déjà enregistrée';return}answered=false;document.querySelectorAll('.answer-choice').forEach(b=>b.disabled=false);return $('result').textContent=d.error||'Erreur'}score=Number(d.players?.find?.(p=>p.user_id===user.id)?.score??score+d.points);$('score').textContent=score+' XP';$('result').textContent=d.correct?'✅ Bonne réponse · +'+d.points+' XP':'❌ Mauvaise réponse';el.classList.add(d.correct?'correct':'wrong')}catch{}}
async function restore(){if(!/^[A-Z0-9]{6}$/.test(code))return waiting('Code de partie invalide.');try{const r=await api('/api/games/'+encodeURIComponent(code)),d=await r.json();if(!r.ok)return waiting(d.error||'Partie introuvable.');const g=d.game;score=Number(g.player?.score||0);$('score').textContent=score+' XP';if(g.status==='finished')return finished();if(g.status==='question'&&g.question)return showQuestion(g.question,g.player?.answer||null);waiting('En attente du lancement…')}catch{}}
function connect(){socket=io({auth:{token},reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:700});socket.on('connect',async()=>{$('reconnect').classList.add('hidden');try{const r=await api('/api/games/'+encodeURIComponent(code)+'/join',{method:'POST',headers:headers()}),d=await r.json();if(!r.ok)return $('result').textContent=d.error||'Impossible de rejoindre';score=Number(d.score??score);$('score').textContent=score+' XP';if(d.status==='finished')return finished();if(d.status==='question'&&d.question)showQuestion(d.question,d.answer||null);socket.emit('join-room',{roomCode:code})}catch{}});socket.on('disconnect',()=>$('reconnect').classList.remove('hidden'));socket.on('connect_error',e=>{if(/Session|Authent/i.test(e.message)){localStorage.removeItem('karhoot_token');localStorage.removeItem('karhoot_user');location.href='/login.html?reason=session-expired'}});socket.on('game-question',q=>{if(q.id===currentQuestionId&&answered)return;showQuestion(q)});socket.on('game-finished',finished);socket.on('room-error',m=>/terminée/i.test(m)?finished():$('result').textContent=m)}
restore().then(connect);
</script><script src="/app.js" defer></script></body></html>
