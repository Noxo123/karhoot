<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karhoot — Jeu</title><script src="https://cdn.tailwindcss.com"></script><script src="/socket.io/socket.io.js"></script></head><body class="min-h-screen bg-slate-950 text-white"><main class="max-w-4xl mx-auto p-5 md:p-10"><header class="flex justify-between"><a href="/" class="font-black text-2xl">🎮 Karhoot</a><span id="score" class="font-black text-indigo-300">0 XP</span></header><section id="waiting" class="text-center mt-24"><div class="text-6xl">🚀</div><h1 class="text-4xl font-black mt-5">Tu es dans la partie !</h1><p class="text-slate-400 mt-2">Attends que ton professeur lance la prochaine question.</p></section><section id="question" class="hidden mt-12"><div class="text-sm text-indigo-300 font-bold" id="meta"></div><h1 id="text" class="text-4xl md:text-5xl font-black mt-3"></h1><div id="answers" class="grid md:grid-cols-2 gap-4 mt-8"></div><p id="result" class="text-center font-bold mt-6"></p></section><section id="finished" class="hidden text-center mt-24"><div class="text-7xl">🏆</div><h1 class="text-5xl font-black mt-5">Partie terminée !</h1><p id="final" class="text-slate-400 mt-3"></p></section></main><script>const token=localStorage.getItem('karhoot_token'),user=JSON.parse(localStorage.getItem('karhoot_user')||'{}'),code=new URLSearchParams(location.search).get('code');if(!token||user.role!=='student')location.href='/login.html';const socket=io();let current=null,score=0;socket.on('connect',async()=>{const r=await fetch('/api/games/'+encodeURIComponent(code)+'/join',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)return alert(d.error||'Impossible de rejoindre');socket.emit('join-room',{roomCode:code,userId:user.id,token});if(d.game?.question)showQuestion(d.game.question)});socket.on('game-question',showQuestion);socket.on('game-finished',()=>{document.getElementById('waiting').classList.add('hidden');document.getElementById('question').classList.add('hidden');document.getElementById('finished').classList.remove('hidden');document.getElementById('final').textContent=`Score final : ${score}`});function showQuestion(q){current=q;document.getElementById('waiting').classList.add('hidden');document.getElementById('finished').classList.add('hidden');document.getElementById('question').classList.remove('hidden');document.getElementById('meta').textContent=`${q.points} points`;document.getElementById('text').textContent=q.question;document.getElementById('result').textContent='';document.getElementById('answers').innerHTML=q.answers.map((a,i)=>`<button onclick="answer(${a.id},this)" class="answer p-6 rounded-3xl bg-white/5 border border-white/10 hover:bg-indigo-500/20 text-left text-xl font-bold transition"><span class="text-indigo-300 mr-3">${String.fromCharCode(65+i)}</span>${a.answer}</button>`).join('')}async function answer(id,el){document.querySelectorAll('.answer').forEach(x=>x.disabled=true);const r=await fetch('/api/games/'+encodeURIComponent(code)+'/answer',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({answerId:id})});const d=await r.json();if(!r.ok)return document.getElementById('result').textContent=d.error||'Erreur';score+=d.points||0;document.getElementById('score').textContent=score+' XP';document.getElementById('result').textContent=d.correct?`✅ Bonne réponse +${d.points}`:'❌ Mauvaise réponse';el.classList.add(d.correct?'bg-emerald-500/20':'bg-rose-500/20')}</script></body></html>
