<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karhoot — Studio SVG</title><link rel="stylesheet" href="/tailwind.css"><link rel="stylesheet" href="/app.css"><style>body{background:#07070b}.glass{background:rgba(18,18,24,.9);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);box-shadow:0 20px 70px rgba(0,0,0,.25)}.stage{position:relative;width:min(480px,92vw);aspect-ratio:1;border-radius:32px;background:radial-gradient(circle at 50% 35%,#ede9fe,#fff 64%);overflow:hidden;border:1px solid #ddd6fe;box-shadow:0 25px 80px rgba(124,58,237,.12)}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.stage img.base{padding:20px}.stage .overlay{pointer-events:none;transform-origin:center}.drop{border:1px dashed rgba(255,255,255,.15);transition:.2s}.drop:hover,.drop.drag{border-color:#8b5cf6;background:rgba(139,92,246,.08)}input,select,textarea{outline:none}input:focus,select:focus,textarea:focus{border-color:#8b5cf6!important}.range{accent-color:#8b5cf6}</style></head><body class="min-h-screen text-white" class="min-h-screen text-white kh-shell"><div class="kh-orb one"></div><div class="kh-orb two"></div><main class="max-w-7xl mx-auto p-5 md:p-8"><header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-7"><div><div class="text-violet-300 text-xs font-black tracking-[.2em]">KARHOOT / SVG STUDIO</div><h1 class="text-3xl md:text-4xl font-black mt-2">Créer un élément</h1><p class="text-white/40 mt-2">Un seul repère de rendu pour l’éditeur, la boutique et les avatars joueurs.</p></div><a href="/teacher-admin.html" class="glass px-4 py-3 rounded-xl hover:bg-white/5">← Administration</a></header><div class="grid xl:grid-cols-[520px_1fr] gap-6"><section class="glass rounded-3xl p-5"><div class="flex items-center justify-between mb-4"><div><div class="font-black">Prévisualisation</div><div class="text-xs text-white/35 mt-1">Canvas canonique 512 × 512</div></div><span id="mode" class="px-2.5 py-1 rounded-full bg-violet-500/10 text-violet-300 text-xs font-bold">NOUVEAU</span></div><div class="stage mx-auto" id="stage"><img class="base" src="https://api.dicebear.com/10.x/toon-head/svg?seed=karhoot-editor&backgroundColor=ffffff&borderRadius=28"><img id="overlay" class="overlay hidden"></div><div class="grid grid-cols-4 gap-2 mt-4"><button data-preset="center" class="glass rounded-xl py-2 text-xs font-bold">Centrer</button><button data-preset="head" class="glass rounded-xl py-2 text-xs font-bold">Tête</button><button data-preset="body" class="glass rounded-xl py-2 text-xs font-bold">Corps</button><button data-preset="reset" class="glass rounded-xl py-2 text-xs font-bold">Reset</button></div><div id="previewName" class="text-center font-black mt-4">Aperçu de ton élément</div></section><section class="glass rounded-3xl p-5 md:p-6"><div class="grid md:grid-cols-2 gap-3"><label class="text-xs text-white/50">Nom<input id="name" class="mt-1 w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-sm" placeholder="Lunettes laser"></label><label class="text-xs text-white/50">Slug<input id="slug" pattern="[a-z0-9-]+" class="mt-1 w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-sm" placeholder="lunettes-laser"></label><label class="text-xs text-white/50">Catégorie<select id="category" class="mt-1 w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-sm"><option value="character">Personnage</option><option value="outfit">Tenue</option><option value="style">Cosmétique SVG</option><option value="background">Fond SVG</option></select></label><label class="text-xs text-white/50">Prix (🪙)<input id="price" type="number" min="0" max="100000" value="100" class="mt-1 w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-sm"></label></div><label class="block text-xs text-white/50 mt-3">Description<textarea id="description" rows="2" maxlength="240" class="mt-1 w-full bg-black/30 border border-white/10 rounded-xl p-3 text-sm" placeholder="Décris l’élément…"></textarea></label><div class="mt-4 grid md:grid-cols-[1fr_auto] gap-3"><div class="drop rounded-2xl p-4"><div class="font-bold text-sm">SVG personnalisé</div><div class="text-xs text-white/35 mt-1">Colle ton SVG ou importe un fichier .svg.</div><input id="file" type="file" accept="image/svg+xml,.svg" class="mt-3 block w-full text-xs"></div><button id="example" class="h-fit bg-white/5 hover:bg-violet-600 border border-white/10 rounded-2xl px-4 py-3 text-sm font-bold">✨ Exemple</button></div><textarea id="svg" rows="10" class="mt-3 w-full bg-black/30 border border-white/10 rounded-2xl p-3 font-mono text-xs" placeholder="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 512 512\">...</svg>"></textarea><div class="grid sm:grid-cols-2 gap-4 mt-5"><label class="text-xs text-white/50">X <input id="x" type="range" min="0" max="100" value="50" step="0.1" class="range w-full"><b id="xv"></b></label><label class="text-xs text-white/50">Y <input id="y" type="range" min="0" max="100" value="50" step="0.1" class="range w-full"><b id="yv"></b></label><label class="text-xs text-white/50">Échelle <input id="scale" type="range" min="5" max="300" value="70" step="0.5" class="range w-full"><b id="sv"></b></label><label class="text-xs text-white/50">Rotation <input id="rotation" type="range" min="-180" max="180" value="0" step="0.5" class="range w-full"><b id="rv"></b></label></div><div class="grid md:grid-cols-2 gap-3 mt-4"><label class="text-xs text-white/50">Point d’ancrage<select id="anchor" class="mt-1 w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3"><option value="center">Centre</option><option value="head">Tête</option><option value="face">Visage</option><option value="body">Corps</option><option value="feet">Pieds</option><option value="back">Dos</option></select></label><label class="text-xs text-white/50">Style<select id="style" class="mt-1 w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3"><option value="toon-head">Toon Head</option><option value="karhoot-custom">Karhoot Custom</option></select></label></div><div class="flex flex-col sm:flex-row gap-3 mt-5"><button id="save" class="flex-1 bg-violet-600 hover:bg-violet-500 rounded-xl py-3 font-black">Créer l’élément</button><a href="/teacher-admin.html" class="glass rounded-xl px-5 py-3 text-center font-bold">Annuler</a></div><div id="msg" class="text-sm mt-3 min-h-5"></div></section></div></main><script src="/js/teacher-nav.js"></script><script>const token=localStorage.getItem('karhoot_token');if(!token)location.href='/';const H={'Content-Type':'application/json',Authorization:`Bearer ${token}`};const $=id=>document.getElementById(id);const qs=new URLSearchParams(location.search);const itemId=Number(qs.get('item')||0);let current=null;async function api(u,o={}){const r=await fetch(u,{...o,headers:{...H,...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}function cleanSvg(v){return v.trim()}function update(){const o=$('overlay'),svg=cleanSvg($('svg').value),x=+$('x').value,y=+$('y').value,s=+$('scale').value,r=+$('rotation').value;$('xv').textContent=x.toFixed(1)+'%';$('yv').textContent=y.toFixed(1)+'%';$('sv').textContent=s.toFixed(1)+'%';$('rv').textContent=r.toFixed(1)+'°';$('previewName').textContent=$('name').value||'Aperçu de ton élément';if(!svg){o.classList.add('hidden');return}o.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);o.classList.remove('hidden');o.style.left=x+'%';o.style.top=y+'%';o.style.width=s+'%';o.style.height=s+'%';o.style.transform=`translate(-50%,-50%) rotate(${r}deg)`}function setPreset(p){if(p==='center'){x.value=50;y.value=50;anchor.value='center'}if(p==='head'){x.value=50;y.value=27;scale.value=70;anchor.value='head'}if(p==='body'){x.value=50;y.value=62;scale.value=80;anchor.value='body'}if(p==='reset'){x.value=50;y.value=50;scale.value=70;rotation.value=0;anchor.value='center'}update()}async function loadExisting(){const d=await api('/api/teacher-admin/catalog');current=(d.items||[]).find(i=>i.id===itemId);if(!current)throw Error('Élément introuvable');$('mode').textContent='MODIFICATION';$('name').value=current.name;$('slug').value=current.slug;$('category').value=current.category;$('price').value=current.price;$('description').value=current.description||'';$('style').value=current.style||'karhoot-custom';$('x').value=current.posX??50;$('y').value=current.posY??50;$('scale').value=current.scale??70;$('rotation').value=current.rotation??0;$('anchor').value=current.anchor||'center';$('save').textContent='Enregistrer les modifications';const r=await fetch(`/api/avatars/custom/${encodeURIComponent(current.slug)}.svg?v=${Date.now()}`,{cache:'no-store'});if(r.ok)$('svg').value=await r.text();update()}$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;const text=await f.text();$('svg').value=text;update()};$('example').onclick=()=>{$('name').value='Lunettes néon';$('slug').value='lunettes-neon';$('category').value='style';$('price').value=75;$('svg').value='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect x="72" y="224" width="150" height="90" rx="35" fill="#8b5cf6" stroke="#111" stroke-width="14"/><rect x="290" y="224" width="150" height="90" rx="35" fill="#8b5cf6" stroke="#111" stroke-width="14"/><path d="M222 258h68" stroke="#111" stroke-width="14"/><path d="M72 246L35 220M440 246l37-26" stroke="#111" stroke-width="14" stroke-linecap="round"/></svg>';$('x').value=50;$('y').value=36;$('scale').value=72;$('anchor').value='face';update()};document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>setPreset(b.dataset.preset));['name','svg','x','y','scale','rotation','anchor','category','price'].forEach(id=>$(id).addEventListener('input',update));$('save').onclick=async()=>{const body={name:$('name').value.trim(),slug:$('slug').value.trim(),category:$('category').value,style:$('style').value,price:+$('price').value,description:$('description').value,icon:'✨',svgContent:$('svg').value,anchor:$('anchor').value,posX:+$('x').value,posY:+$('y').value,scale:+$('scale').value,rotation:+$('rotation').value};if(!body.name||!body.slug||!body.svgContent)return $('msg').textContent='Nom, slug et SVG sont obligatoires.';if(!/^[a-z0-9-]+$/.test(body.slug))return $('msg').textContent='Le slug doit contenir uniquement a-z, 0-9 et -.';try{if(itemId)await api(`/api/teacher-admin/catalog/items/${itemId}`,{method:'PATCH',body:JSON.stringify(body)});else await api('/api/teacher-admin/catalog/items',{method:'POST',body:JSON.stringify(body)});$('msg').textContent=itemId?'Modifications enregistrées ✓':'Élément créé ✓';$('msg').className='text-emerald-300 text-sm mt-3';setTimeout(()=>location.href='/teacher-admin.html',500)}catch(e){$('msg').textContent=e.message;$('msg').className='text-red-300 text-sm mt-3'}};if(itemId)loadExisting().catch(e=>{$('msg').textContent=e.message;$('msg').className='text-red-300'});else update();</script><script src="/app.js" defer></script></body></html>
