<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karhoot — Éditeur SVG</title><link rel="stylesheet" href="/tailwind.css"><style>body{background:#07070b}.glass{background:rgba(18,18,24,.88);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px)}.stage{position:relative;width:min(420px,90vw);aspect-ratio:1;border-radius:32px;background:radial-gradient(circle at 50% 35%,#ede9fe,#fff 60%);overflow:hidden;border:1px solid #ddd6fe}.stage img.base{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain}.stage img.overlay{position:absolute;object-fit:contain;transform-origin:center}.range{accent-color:#8b5cf6}</style></head><body class="min-h-screen text-white"><main class="max-w-6xl mx-auto p-5 md:p-8"><header class="flex justify-between items-center mb-7"><div><div class="text-violet-300 text-xs font-black tracking-[.2em]">KARHOOT / SVG STUDIO</div><h1 class="text-3xl md:text-4xl font-black mt-2">Éditeur de cosmétiques</h1><p class="text-white/40 mt-2">Place précisément tes éléments sur un personnage de référence.</p></div><a href="/teacher-admin.html" class="glass px-4 py-3 rounded-xl">← Administration</a></header><div class="grid lg:grid-cols-[440px_1fr] gap-6"><section class="glass rounded-3xl p-5"><div class="stage mx-auto"><img class="base" src="https://api.dicebear.com/10.x/toon-head/svg?seed=karhoot-editor&backgroundColor=ffffff"><img id="overlay" class="overlay hidden"></div><div id="previewName" class="text-center font-black mt-4">Sélectionne un cosmétique</div></section><section class="glass rounded-3xl p-5"><div class="flex flex-wrap gap-2 mb-4"><button id="example" class="px-4 py-2 rounded-xl bg-violet-600 font-bold">✨ Exemple chapeau</button><button id="center" class="px-4 py-2 rounded-xl bg-white/5">Centrer</button><button id="head" class="px-4 py-2 rounded-xl bg-white/5">Sur la tête</button></div><select id="item" class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 mb-4"><option value="">Choisir un cosmétique SVG…</option></select><textarea id="svg" rows="9" class="w-full bg-black/30 border border-white/10 rounded-xl p-3 font-mono text-xs" placeholder="SVG"></textarea><div class="grid sm:grid-cols-2 gap-4 mt-4"><label class="text-xs text-white/50">X <input id="x" type="range" min="0" max="100" value="50" class="range w-full"><b id="xv"></b></label><label class="text-xs text-white/50">Y <input id="y" type="range" min="0" max="100" value="50" class="range w-full"><b id="yv"></b></label><label class="text-xs text-white/50">Échelle <input id="scale" type="range" min="5" max="300" value="70" class="range w-full"><b id="sv"></b></label><label class="text-xs text-white/50">Rotation <input id="rotation" type="range" min="-180" max="180" value="0" class="range w-full"><b id="rv"></b></label></div><select id="anchor" class="w-full mt-4 bg-black/30 border border-white/10 rounded-xl px-4 py-3"><option value="center">Centre</option><option value="head">Tête</option><option value="face">Visage</option><option value="body">Corps</option><option value="feet">Pieds</option><option value="back">Dos</option></select><button id="save" class="w-full mt-4 bg-violet-600 hover:bg-violet-500 rounded-xl py-3 font-black">Enregistrer</button><div id="msg" class="text-sm mt-3"></div></section></div></main><script>
const token=localStorage.getItem('karhoot_token');if(!token)location.href='/';const H={'Content-Type':'application/json',Authorization:`Bearer ${token}`};const $=x=>document.getElementById(x);let items=[],current=null;async function api(u,o={}){const r=await fetch(u,{...o,headers:{...H,...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}async function load(){const d=await api('/api/teacher-admin/catalog');items=d.items.filter(x=>x.category==='style'&&x.has_svg);$('item').innerHTML='<option value="">Choisir un cosmétique SVG…</option>'+items.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}async function selectItem(){current=items.find(x=>x.id===+$('item').value);if(!current)return;$('previewName').textContent=current.name;$('x').value=current.posX??50;$('y').value=current.posY??50;$('scale').value=current.scale??70;$('rotation').value=current.rotation??0;$('anchor').value=current.anchor||'center';$('svg').value=await (await fetch(`/api/avatars/custom/${encodeURIComponent(current.slug)}.svg`)).text();update()}function update(){const o=$('overlay'),svg=$('svg').value.trim(),x=+$('x').value,y=+$('y').value,s=+$('scale').value,r=+$('rotation').value;$('xv').textContent=x+'%';$('yv').textContent=y+'%';$('sv').textContent=s+'%';$('rv').textContent=r+'°';if(!svg){o.classList.add('hidden');return}o.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);o.classList.remove('hidden');o.style.left=x+'%';o.style.top=y+'%';o.style.width=s+'px';o.style.height=s+'px';o.style.transform=`translate(-50%,-50%) rotate(${r}deg)`}$('item').onchange=selectItem;['x','y','scale','rotation','anchor','svg'].forEach(id=>$(id).oninput=update);$('center').onclick=()=>{$('x').value=50;$('y').value=50;update()};$('head').onclick=()=>{$('x').value=50;$('y').value=27;$('scale').value=70;$('anchor').value='head';update()};$('example').onclick=()=>{$('svg').value='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><path d="M44 104h168v38H44z" fill="#7c3aed"/><path d="M74 104V65c0-30 108-30 108 0v39" fill="#a78bfa"/><path d="M100 72h56v17h-56z" fill="#fff" opacity=".9"/><circle cx="128" cy="56" r="7" fill="#fbbf24"/></svg>';$('x').value=50;$('y').value=27;$('scale').value=70;$('anchor').value='head';$('previewName').textContent='Exemple — Chapeau Karhoot';update()};$('save').onclick=async()=>{if(!current)return $('msg').textContent='Sélectionne un cosmétique.';try{await api(`/api/teacher-admin/catalog/items/${current.id}`,{method:'PATCH',body:JSON.stringify({svgContent:$('svg').value,name:current.name,price:current.price,anchor:$('anchor').value,posX:+$('x').value,posY:+$('y').value,scale:+$('scale').value,rotation:+$('rotation').value})});$('msg').textContent='Enregistré ✓';$('msg').className='text-emerald-300 text-sm mt-3';await load()}catch(e){$('msg').textContent=e.message;$('msg').className='text-red-300 text-sm mt-3'}};load().catch(e=>$('msg').textContent=e.message);
</script></body></html>
